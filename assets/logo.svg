<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF79A1"/>
      <stop offset="1" stop-color="#FF9A00"/>
    </linearGradient>
    <clipPath id="upper">
      <rect width="64" height="32"/>
    </clipPath>
    <clipPath id="lower">
      <rect y="32" width="64" height="32"/>
    </clipPath>
    <mask id="cut-left" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="40" cy="32" r="16" stroke="#000" stroke-width="13" clip-path="url(#lower)"/>
    </mask>
    <mask id="cut-right" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="24" cy="32" r="16" stroke="#000" stroke-width="13" clip-path="url(#upper)"/>
    </mask>
  </defs>
  <circle cx="24" cy="32" r="16" stroke="url(#gradient)" stroke-width="9" mask="url(#cut-left)"/>
  <circle cx="40" cy="32" r="16" stroke="#3178C6" stroke-width="9" mask="url(#cut-right)"/>
</svg>
