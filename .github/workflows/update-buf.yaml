name: update-buf

on:
  schedule:
    - cron: '0 11 * * *' # JST 20:00
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has_targets: ${{ steps.parse.outputs.has_targets }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: parse buf.gen.yaml
        id: parse
        run: |
          matrix=$(yq -o=json -I=0 '[.inputs[] | select(.git_repo and .tag) | {
            "repo": (.git_repo | sub(".*github\.com/"; "") | sub("\.git$"; "")),
            "currentTag": .tag,
            "gitRepo": .git_repo
          }]' buf.gen.yaml)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = "[]" ]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: detect
    if: needs.detect.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: get latest tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
        run: |
          tag=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: check if update needed
        id: check
        env:
          CURRENT_TAG: ${{ matrix.currentTag }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: setup vite+
        if: steps.check.outputs.skip != 'true'
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24.22.1'
          cache: true

      - name: update buf.gen.yaml
        if: steps.check.outputs.skip != 'true'
        env:
          GIT_REPO: ${{ matrix.gitRepo }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: yq -i '(.inputs[] | select(.git_repo == strenv(GIT_REPO))).tag = strenv(LATEST_TAG)' buf.gen.yaml

      - name: generate code
        if: steps.check.outputs.skip != 'true'
        run: vp run generate

      - name: create pull request
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: update-proto/${{ matrix.repo }}/${{ steps.latest.outputs.tag }}
          delete-branch: true
          title: 'chore(buf): update ${{ matrix.repo }} to ${{ steps.latest.outputs.tag }}'
          body: |
            Updates `${{ matrix.repo }}` from `${{ matrix.currentTag }}` to `${{ steps.latest.outputs.tag }}`

            - [Compare changes](https://github.com/${{ matrix.repo }}/compare/${{ matrix.currentTag }}...${{ steps.latest.outputs.tag }})
          commit-message: 'chore(buf): update ${{ matrix.repo }} to ${{ steps.latest.outputs.tag }}'
          labels: dependencies
